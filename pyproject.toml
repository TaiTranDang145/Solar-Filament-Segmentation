[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament-segmentation"
version = "0.1.0"
description = "Reproducible MAGFiLO instance-segmentation baseline for the 2026 challenge"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "Pillow==10.2.0",
  "pycocotools==2.0.10",
  "timm==1.0.29",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "ultralytics==8.4.115",
]

[project.scripts]
solar-filament = "solar_filament.cli:main"

[tool.setuptools.packages.find]
include = ["solar_filament*"]
